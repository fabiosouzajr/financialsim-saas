[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finacialsim-saas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.0",
    "arq>=0.25.0",
    "finacialsim-core",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "testcontainers[postgres,redis]>=4.7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
finacialsim-saas = "finacialsim_saas.cli.main:app"

[tool.uv.sources]
finacialsim-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
