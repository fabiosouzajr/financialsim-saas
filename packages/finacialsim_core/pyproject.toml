[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finacialsim-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "python-dateutil>=2.9",
    "babel>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.0.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
